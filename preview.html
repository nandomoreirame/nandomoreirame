<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Preview do perfil</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      background: #0B0B0C;
      color: #A1A1AA;
      font: 13px/1.4 "Noto Sans", "Segoe UI", Helvetica, Arial, sans-serif;
    }
    main {
      width: min(896px, calc(100% - 32px));
      margin: 28px auto 48px;
    }
    p { margin: 0 0 16px; }
    img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 0 16px;
    }
  </style>
</head>
<body>
  <main>
    <p>Preview local, na largura da coluna do perfil no GitHub. Nada disso foi enviado ao origin.</p>
    <img src="./assets/profile-header.svg" alt="Cabeçalho do perfil">
    <img src="./assets/contributions.svg" alt="Atividade no GitHub">
    <img src="./assets/tech-ecosystem.svg" alt="Ecossistema">
  </main>
</body>
</html>
